[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datastream"
version = "0.1.0"
description = "Unified market data pipeline: ingestion, normalization, storage, quality, point-in-time universes"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "FIREKit Team" }]
keywords = ["market-data", "ohlcv", "parquet", "data-quality", "point-in-time"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "pyarrow>=14.0.0",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["datastream"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["datastream"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-q --tb=short"
