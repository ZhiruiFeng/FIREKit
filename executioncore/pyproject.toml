[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "executioncore"
version = "0.1.0"
description = "Order management and trading execution engine with paper-broker simulation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "FIREKit Team" }]
keywords = ["trading", "order-management", "execution", "twap", "vwap", "paper-trading"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["executioncore"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["executioncore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --tb=short"
