[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentimentpulse"
version = "0.1.0"
description = "Financial text sentiment analysis: lexicon scoring, provider abstraction, news pipeline, sentiment indexes"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "FIREKit Team" }]
keywords = ["sentiment-analysis", "nlp", "finance", "news", "trading-signals"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["sentimentpulse"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["sentimentpulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-q --tb=short"
