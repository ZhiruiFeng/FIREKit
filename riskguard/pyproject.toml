[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "riskguard"
version = "0.1.0"
description = "Position sizing and risk management toolkit: Kelly sizing, vol targeting, drawdown circuit breakers, VaR/CVaR, exposure limits"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "FIREKit Team" }]
keywords = ["risk-management", "kelly-criterion", "value-at-risk", "position-sizing", "drawdown"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["riskguard"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["riskguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-q --tb=short"
